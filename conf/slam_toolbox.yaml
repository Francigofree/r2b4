# ROS-only edge parameters. Robot geometry/range comes from the resolved
# native acquisition configuration, carried with each source scan.
slam_toolbox:
  ros__parameters:
    use_sim_time: false
    use_lifecycle_manager: false
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    odom_frame: R2B4_ODOM_LOCAL
    map_frame: R2B4_BOOT_ROBOT_MAP
    base_frame: base_link
    scan_topic: /r2b4/slam/scan
    mode: mapping
    use_map_saver: false
    enable_interactive_mode: false
    debug_logging: false
    scan_queue_size: 1
    throttle_scans: 1
    minimum_time_interval: 0.18
    transform_timeout: 0.1
    tf_buffer_duration: 5.0
    transform_publish_period: 0.1
    restamp_tf: false
    map_update_interval: 2.0
    resolution: 0.05
    stack_size_to_use: 40000000
    use_scan_matching: true
    use_scan_barycenter: true
    # Repeated scan matches also refresh independent localization at rest.
    # The bridge enforces finite map/session budgets instead of growing forever.
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0
    check_min_dist_and_heading_precisely: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
