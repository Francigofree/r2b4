# ROS navigation compute only. V3 L5 and L9-L12 own mission and all actuation.
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    costmap_update_timeout: 0.15
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.10
      use_astar: true
      allow_unknown: false
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: R2B4_BOOT_ROBOT_MAP
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 1.0
      # explore_lite starts with an admitted mission and needs a full grid even
      # when it subscribes after the initial transient Nav2 publication.
      always_send_full_costmap: true
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.2
      # Runtime launcher overrides geometry from resolved V3 navigation config.
      # Physical polygon and body padding are injected from resolved V3 config.
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 6.0
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /r2b4/slam/scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          observation_persistence: 0.0
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    enable_stamped_cmd_vel: true
    odom_topic: /r2b4/odom
    speed_limit_topic: /speed_limit
    costmap_update_timeout: 0.2
    failure_tolerance: 0.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.01
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.10
      required_movement_angle: 0.10
      movement_time_allowance: 8.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
      stateful: true
    FollowPath:
      plugin: r2b4_nav2::WheelAwareRegulatedPurePursuitController
      desired_linear_vel: 0.25
      lookahead_dist: 0.35
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.5
      lookahead_time: 1.2
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.19
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.45
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 6.0
      min_approach_linear_velocity: 0.19
      approach_velocity_scaling_dist: 0.3
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.2
      rotate_to_heading_min_angle: 0.5
      max_angular_accel: 2.0
      allow_reversing: false
      stateful: true
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: R2B4_ODOM_LOCAL
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 1.0
      transform_tolerance: 0.2
      # Passive 5 Hz snapshots reuse this bounded 60x60 full grid. Without
      # full publication a stationary rolling window emits updates only.
      always_send_full_costmap: true
      # Same physical polygon and L12 body padding as the global map.
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /r2b4/slam/scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 6.0
behavior_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: true
    cycle_frequency: 20.0
    local_frame: R2B4_ODOM_LOCAL
    global_frame: R2B4_BOOT_ROBOT_MAP
    robot_base_frame: base_link
    transform_tolerance: 0.2
    local_costmap_topic: /local_costmap/costmap_raw
    global_costmap_topic: /global_costmap/costmap_raw
    local_footprint_topic: /local_costmap/published_footprint
    global_footprint_topic: /global_costmap/published_footprint
    simulate_ahead_time: 1.0
    behavior_plugins: [wait, spin, backup]
    wait:
      plugin: nav2_behaviors::Wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: R2B4_BOOT_ROBOT_MAP
    robot_base_frame: base_link
    odom_topic: /r2b4/odom
    transform_tolerance: 0.2
    bt_loop_duration: 20
    default_server_timeout: 200
    error_code_names: [compute_path_error_code, follow_path_error_code, spin_error_code, backup_error_code]
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
