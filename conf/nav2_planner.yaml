# Planner-only capability. V3 owns local collision proof and all actuation.
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    costmap_update_timeout: 0.15
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.10
      use_astar: true
      allow_unknown: false
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: R2B4_BOOT_ROBOT_MAP
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.2
      # Runtime launcher overrides geometry from resolved V3 navigation config.
      robot_radius: 0.30
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.40
        cost_scaling_factor: 3.0
