# ROS navigation compute only. V3 L5 and L9-L12 own mission and all actuation.
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    costmap_update_timeout: 0.15
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.10
      allow_unknown: false
      downsample_costmap: false
      max_iterations: 100000
      max_on_approach_iterations: 100
      terminal_checking_interval: 100
      max_planning_time: 0.15
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 100
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: R2B4_BOOT_ROBOT_MAP
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 1.0
      # explore_lite starts with an admitted mission and needs a full grid even
      # when it subscribes after the initial transient Nav2 publication.
      always_send_full_costmap: true
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.2
      # Runtime launcher overrides geometry from resolved V3 navigation config.
      # Physical polygon and body padding are injected from resolved V3 config.
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Narrow only the soft preference field; physical body + L12 padding
        # remain unchanged and the radius still exceeds the padded corners.
        inflation_radius: 0.50
        cost_scaling_factor: 8.0
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /r2b4/slam/scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          observation_persistence: 0.0
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    enable_stamped_cmd_vel: true
    odom_topic: /r2b4/odom
    speed_limit_topic: /speed_limit
    costmap_update_timeout: 0.2
    failure_tolerance: 0.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.01
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.10
      required_movement_angle: 0.10
      movement_time_allowance: 8.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
      stateful: true
    FollowPath:
      plugin: r2b4_nav2::WheelAwareMPPIController
      # 1.6 s horizon, 400 rollouts, one iteration. All work stays in ROS.
      motion_model: DiffDrive
      model_dt: 0.05
      time_steps: 32
      batch_size: 400
      iteration_count: 1
      vx_std: 0.25
      vy_std: 0.0
      wz_std: 0.8
      vx_max: 0.30
      vx_min: -0.20
      vy_max: 0.0
      wz_max: 1.4
      prune_distance: 1.5
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      retry_attempt_limit: 1
      regenerate_noises: false
      visualize: false
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic, R2B4WheelCritic]
      ConstraintCritic:
        cost_weight: 4.0
      CostCritic:
        cost_weight: 3.81
        consider_footprint: true
        collision_cost: 1000000.0
        critical_cost: 300.0
        near_goal_distance: 0.3
        trajectory_point_step: 2
      GoalCritic:
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        cost_weight: 3.0
        threshold_to_consider: 0.3
      PathAlignCritic:
        cost_weight: 14.0
        trajectory_point_step: 4
        threshold_to_consider: 0.3
        offset_from_furthest: 8
        max_path_occupancy_ratio: 0.05
        use_path_orientations: false
      PathFollowCritic:
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.3
      PathAngleCritic:
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.3
        max_angle_to_furthest: 0.785398
        mode: 1
      PreferForwardCritic:
        cost_weight: 1.0
        threshold_to_consider: 0.3
      R2B4WheelCritic:
        cost_weight: 10.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: R2B4_ODOM_LOCAL
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.2
      # Passive 5 Hz snapshots reuse this bounded 60x60 full grid. Without
      # full publication a stationary rolling window emits updates only.
      always_send_full_costmap: true
      # Same physical polygon and L12 body padding as the global map.
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /r2b4/slam/scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.50
        cost_scaling_factor: 8.0
behavior_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: true
    cycle_frequency: 20.0
    local_frame: R2B4_ODOM_LOCAL
    global_frame: R2B4_BOOT_ROBOT_MAP
    robot_base_frame: base_link
    transform_tolerance: 0.2
    local_costmap_topic: /local_costmap/costmap_raw
    global_costmap_topic: /global_costmap/costmap_raw
    local_footprint_topic: /local_costmap/published_footprint
    global_footprint_topic: /global_costmap/published_footprint
    simulate_ahead_time: 1.0
    behavior_plugins: [wait, spin, backup]
    wait:
      plugin: nav2_behaviors::Wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: R2B4_BOOT_ROBOT_MAP
    robot_base_frame: base_link
    odom_topic: /r2b4/odom
    transform_tolerance: 0.2
    bt_loop_duration: 20
    default_server_timeout: 200
    error_code_names: [compute_path_error_code, follow_path_error_code, spin_error_code, backup_error_code]
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
