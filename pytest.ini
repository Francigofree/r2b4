[pytest]
testpaths =
    tests/packs
pythonpath = .
python_files = test_*.py
norecursedirs = runtime .git .venv .upgrade_backups
addopts = --strict-markers -m "not endurance"
markers =
    endurance: explicit long-running validation; never part of gate/release
    gate: legacy developer metadata; gate selection is manifest-owned
    contract: legacy developer metadata
    async_boundary: legacy developer metadata
    runtime: legacy developer metadata
    replay: legacy developer metadata
    control: legacy developer metadata
    perception: legacy developer metadata
    evidence: legacy developer metadata
    voice: legacy developer metadata
    providers: legacy developer metadata
