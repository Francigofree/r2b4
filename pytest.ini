[pytest]
testpaths = tests
norecursedirs = runtime .git .venv .upgrade_backups
addopts = --strict-markers
markers =
    gate: fast high-signal V3 checks for the first validation pass
    contract: V3 authority, layer-boundary, isolation and safety contracts
    async_boundary: async edge, completion/input-closure, process and multirate behavior
    runtime: TickEngine, composition, resident/process runtime and scheduling
    replay: capture, MCAP, replay determinism and evidence-path behavior
    control: mission, planning, motion, safety and motor-control chain
    perception: sensor edges, localization, L4/world-model and perception
    testhub: offline Test Hub, evidence, quality and correlation pipeline
    voice: human/robot conversation, prompting, voice and robot-context behavior
    providers: external AI/provider adapter behavior; not a robot-core gate
